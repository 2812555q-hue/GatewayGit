# TCP server config
SERVER_IP=192.xxx.xxx.xxx
SERVER_PORT=9999

# UART config
UART_DEV=/dev/ttyAS5
UART_BAUD=115200

# Heartbeat config
HEART_TIMEOUT=10
HEART_MISS_MAX=3

# Protocol
ENABLE_CRC=1

# Reconnect backoff
RECONNECT_MIN_MS=1000
RECONNECT_MAX_MS=30000

# Logging
LOG_LEVEL=INFO
LOG_FILE=

# Stats
STATS_INTERVAL=10
